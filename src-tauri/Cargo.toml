[package]
name = "ncore"
version = "11.7.119"
description = "NCore native desktop client"
authors = ["NYPTID Industries Advanced Technologies"]
edition = "2021"
autobins = false

[[bin]]
name = "ncore"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
keyring = "4.1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"

[profile.release]
# Desktop distribution builds should favor startup and download size over a
# marginal gain in compile speed. Symbols are not useful in the shipped EXE.
strip = "symbols"
lto = "thin"
codegen-units = 1
opt-level = "z"
panic = "abort"
